<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HOWL — Evolution Essay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #5a4f42; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      color: #f5efe6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .evolution {
      min-height: 1.2em;
      margin: 10px 0;
      background: #5a4f42;
      padding: 16px 20px;
      border-radius: 8px;
      border: none;
      text-align: justify;
      text-justify: inter-word;
    }
    .derivation-tree, .etymology-tree {
      font-family: 'JetBrains Mono', 'Cascadia Mono', Courier, monospace;
      font-size: 0.9em;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      background: #5a4f42;
      padding: 18px;
      border-radius: 8px;
      margin: 15px 0;
      min-height: 1.2em;
      border: none;
      color: #f5efe6;
    }
    b, strong { color: #fbbf24; }
    i, em { color: #d9cdbd; }
  </style>
</head>
<body>
↓<br>
<i>Old English</i> <span style="color:#8a8378;font-size:0.8em">(imitative; related)</span><br>
<b>hūtan</b><br>
<u>"to howl"</u><br>
↓<br>
<i>Middle English</i> <span style="color:#8a8378;font-size:0.8em">(c. 1300)</span><br>
<b>houlen</b><br>
<u>"to howl, wail"</u><br>
↓<br>
<i>English</i> <span style="color:#8a8378;font-size:0.8em">(present)</span><br>
<b class="target">howl</b><br>
<u>"to utter a long, loud,</u><br>
<u>doleful cry or wail"</u><br>
<span style="color:#8a8378;font-size:0.8em">Echoic: of imitative origin,</span><br>
<span style="color:#8a8378;font-size:0.8em">no PIE ancestor; the exact</span><br>
<span style="color:#8a8378;font-size:0.8em">relation to OE <i>hūtan</i> is</span><br>
<span style="color:#8a8378;font-size:0.8em">uncertain.</span>
</body>
</html>
