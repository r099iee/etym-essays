<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EARNEST T3 — Evolution Essay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #14110e; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .evolution {
      min-height: 1.2em;
      margin: 10px 0;
      background: #201b16;
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid #332b23;
      text-align: justify;
      text-justify: inter-word;
      transition: border-color 0.2s ease;
    }
    .evolution:hover { border-color: #453a2f; }
    .derivation-tree, .etymology-tree {
      font-family: 'JetBrains Mono', 'Cascadia Mono', Courier, monospace;
      font-size: 0.9em;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      background: #181411;
      padding: 18px;
      border-radius: 8px;
      margin: 15px 0;
      min-height: 1.2em;
      border-left: 3px solid #f59e0b;
      border-top: 1px solid #2e261f;
      border-right: 1px solid #2e261f;
      border-bottom: 1px solid #2e261f;
      color: #f8fafc;
    }
    b, strong { color: #fbbf24; }
    i, em { color: #cbd5e1; }
  </style>
</head>
<body>
He made an <b>__________</b> attempt to rectify his past mistakes and rebuild trust with his family.<br><br>Her <b>__________</b> expression convinced the jury of her complete honesty.<br><br>The two leaders began <b>__________</b> negotiations to avert a potential diplomatic crisis.
</body>
</html>
