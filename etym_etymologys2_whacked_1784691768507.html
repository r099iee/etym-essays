↓<br>
<i>English</i> <span style="color:#8a8378;font-size:0.8em">(18th c.; origin uncertain)</span><br>
<b>whack</b><br>
<u>"to strike with a sharp,</u><br>
<u>resounding blow"</u><br>
↓<br>
<i>English</i> <span style="color:#8a8378;font-size:0.8em">(past tense)</span><br>
<b class="target">whacked</b><br>
<u>"struck forcefully with a</u><br>
<u>sharp, resounding blow"</u><br>
<span style="color:#8a8378;font-size:0.8em">Echoic and of uncertain origin:</span><br>
<span style="color:#8a8378;font-size:0.8em">no attested ancestor; possibly</span><br>
<span style="color:#8a8378;font-size:0.8em">related to <b>thwack</b> or formed</span><br>
<span style="color:#8a8378;font-size:0.8em">from an echoic Germanic base.</span>
